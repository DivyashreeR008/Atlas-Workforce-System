# #487: PgBouncer fronting Postgres (transaction pooling) in the k8s shape.
# Services connect to the pgbouncer Service on 6432; the primary postgres
# Service stays for admin and for pgbouncer itself. max_prepared_statements
# keeps pgjdbc/pgx protocol-level prepared statements usable in transaction
# mode (pgbouncer >= 1.21).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
      - name: pgbouncer
        image: edoburu/pgbouncer:1.24.0-p1
        ports:
        - containerPort: 6432
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: atlas-secrets
              key: postgres-user
              optional: true
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: atlas-secrets
              key: postgres-password
              optional: true
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: atlas-config
              key: POSTGRES_DB
              optional: true
        - name: AUTH_TYPE
          value: md5
        - name: POOL_MODE
          value: transaction
        - name: LISTEN_ADDR
          value: 0.0.0.0
        - name: LISTEN_PORT
          value: "6432"
        - name: MAX_CLIENT_CONN
          value: "400"
        - name: DEFAULT_POOL_SIZE
          value: "20"
        - name: MIN_POOL_SIZE
          value: "5"
        - name: RESERVE_POOL_SIZE
          value: "5"
        - name: MAX_DB_CONNECTIONS
          value: "100"
        - name: MAX_PREPARED_STATEMENTS
          value: "200"
        readinessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6432
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
spec:
  selector:
    app: pgbouncer
  ports:
  - port: 6432
    targetPort: 6432
