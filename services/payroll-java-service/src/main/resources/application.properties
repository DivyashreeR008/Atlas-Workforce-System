server.port=8002
spring.application.name=payroll-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/atlas_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=payroll_flyway_schema_history

# Outbox Pattern Configuration
outbox.poll.interval=5000
outbox.max.retries=5
payroll.exchange.name=payroll.exchange
payroll.processed.queue=payroll.processed.queue
payroll.compensation.queue=payroll.compensation.queue
payroll.dlq.name=payroll.dlq

# Simple progressive tax bands used as the fallback when a tenant has no
# country tax configuration or bracket rows. The defaults mirror the values
# that used to be literals in the tax calculation. Income up to lower-limit is
# untaxed, then each band applies its rate up to the next limit, and high-rate
# applies to everything above upper-limit.
payroll.simple-tax.lower-limit=3000.00
payroll.simple-tax.middle-limit=7000.00
payroll.simple-tax.upper-limit=12000.00
payroll.simple-tax.low-rate=0.15
payroll.simple-tax.middle-rate=0.25
payroll.simple-tax.high-rate=0.35
